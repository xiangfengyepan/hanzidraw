[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanzidraw"
version = "0.1.0"
description = "A desktop Chinese IME that draws the character stroke-by-stroke"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
mouse = ["pynput>=1.7"]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.5"]

[project.scripts]
hanzidraw = "hanzidraw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hanzidraw"]

[tool.hatch.build.targets.sdist]
# Allowlist, not an exclude list: local-only directories are kept out of the
# source distribution by omission, without depending on ignore files.
include = [
    "src/hanzidraw",
    "tests",
    "pyproject.toml",
    "NOTICE",
    "README.md",
    "hanzidraw.spec",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
